include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Unused code and missing awaits are errors, not suggestions: a forgotten
    # await in the sync worker is a data-loss bug.
    unawaited_futures: error
    unused_import: error
    unused_local_variable: error

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - unawaited_futures
